name: Continuous deployment

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: make install-dev

      - name: Run static checks
        run: make check

      - name: Prune uv cache
        run: uv cache prune --ci

  test-python:
    name: Test Python code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install native GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          channels: conda-forge
          channel-priority: strict
          create-args: >-
            python=${{ matrix.python }}
            gdal=3.12.2
          init-shell: bash

      - name: Configure GDAL runtime
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.12.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - id: install-python-dependencies
        name: Install Python dependencies
        shell: bash -el {0}
        run: make install-test GDAL_PYTHON="$CONDA_PREFIX/bin/python"

      - id: tests
        name: Run tests
        shell: bash -el {0}
        run: make test GDAL_PYTHON="$CONDA_PREFIX/bin/python"

      - id: coverage
        name: Enforce coverage
        if: matrix.python == '3.13' && vars.PACKAGE_IMPORT_NAME != ''
        env:
          PACKAGE_IMPORT_NAME: ${{ vars.PACKAGE_IMPORT_NAME }}
        shell: bash -el {0}
        run: >-
          make coverage PACKAGE="$PACKAGE_IMPORT_NAME"
          GDAL_PYTHON="$CONDA_PREFIX/bin/python"

      - name: Prune uv cache
        run: uv cache prune --ci

  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    needs: [check, test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - id: build
        name: Build releases
        run: make build

      - id: package-check
        name: Check wheel installation
        if: vars.PACKAGE_IMPORT_NAME != ''
        env:
          PACKAGE_IMPORT_NAME: ${{ vars.PACKAGE_IMPORT_NAME }}
        run: |
          make install-dev
          make package-check PACKAGE="$PACKAGE_IMPORT_NAME"

      - name: Prune uv cache
        run: uv cache prune --ci

      - id: save
        name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error

  release:
    name: PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
    steps:
      - id: fetch
        name: Fetch artifact
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ./dist

      - id: publish
        name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          verify-metadata: false
